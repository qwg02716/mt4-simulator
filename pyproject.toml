[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mt4-simulator"
version = "0.1.0"
description = "MT4 Open-Prices-Only backtest engine and indicators for Python"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
]

[project.optional-dependencies]
fast = ["scipy>=1.7"]
dev  = ["scipy>=1.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mt4_simulator*"]
